<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signaluo — Signaler un problème</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app-entry.js"></script>
  </head>
  <body>
    <main class="site visible entering" id="application-page">
      <section class="phone" aria-label="Application Signaluo">
        <div class="phone-bar"></div>
        <section class="launch-screen" aria-labelledby="launch-title">
          <div class="launch-mark">⌖</div>
          <span class="eyebrow">ESPACE CITOYEN</span>
          <h1 id="launch-title">Prêt à agir pour votre ville ?</h1>
          <p>Lancez l’application Signaluo pour signaler rapidement un problème près de chez vous.</p>
          <button class="launch-button" type="button" id="launch-app">Lancer l’application <span>→</span></button>
        </section>
        <div id="app" class="app" aria-hidden="true"></div>
      </section>
    </main>
    <div id="toast" class="toast" role="status"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="app.js"></script>
  </body>
</html>
