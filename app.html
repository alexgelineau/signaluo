<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Signaluo — Signaler un problème</title>
		<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css" />
		<meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
		<script>document.write('<link rel="stylesheet" href="styles.css?v=' + Date.now() + '" />');</script>
		<script src="app-entry.js"></script>
	</head>

	<body>
		<main class="site visible entering" id="application-page">
			<!-- Aperçu du futur logiciel de gestion municipal. -->
			<section class="management-preview" aria-labelledby="management-title">
				<h2 class="management-page-title">Interface d’administration</h2>

				<div class="mac-window-bar">
					<div class="mac-window-controls" aria-hidden="true">
						<span></span>
						<span></span>
						<span></span>
					</div>
					<span class="mac-window-title">Signaluo Manager</span>
					<!-- Centre de notifications : cloche avec pastille de non-lus. -->
					<button class="notif-bell" type="button" data-notif-toggle aria-label="Centre de notifications" title="Notifications"></button>
				</div>

				<div class="mac-window-body">
					<aside class="mac-sidebar">
						<div class="mac-brand">
							<span><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /> <line x1="22" x2="18" y1="12" y2="12" /> <line x1="6" x2="2" y1="12" y2="12" /> <line x1="12" x2="12" y1="6" y2="2" /> <line x1="12" x2="12" y1="22" y2="18" /></svg></span>
							Signaluo
						</div>
						<button class="mac-nav active" type="button" data-admin-action="dashboard">
							<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>
							<span>Tableau de bord</span>
						</button>
						<button class="mac-nav" type="button" data-admin-action="reports">
							<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
							<span>Signalements</span>
						</button>
						<button class="mac-nav" type="button" data-admin-action="map">
							<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg>
							<span>Carte</span>
						</button>
						<button class="mac-nav" type="button" data-admin-action="employees">
							<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/><path d="M18 14.3c2.2.7 3.5 2.6 3.5 5.7"/></svg>
							<span>Employés</span>
						</button>
						<button class="mac-nav" type="button" data-admin-action="settings">
							<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.5" fill="currentColor" fill-opacity=".15"/><circle cx="15" cy="17" r="2.5" fill="currentColor" fill-opacity=".15"/></svg>
							<span>Paramètres</span>
						</button>
					</aside>

					<div class="mac-content">
						<div id="admin-content"></div>
					</div>
				</div>
			</section>

			<!-- Sélecteur entre les deux futures versions de Signaluo. -->
			<div class="app-column">
				<div class="app-switch-row">
				<div
					class="app-switcher"
					role="tablist"
					aria-label="Choisir une version de l’application"
				>
					<button
						class="version-tab active"
						type="button"
						role="tab"
						aria-selected="true"
						data-version="user"
						aria-label="Version Utilisateur"
					>
						Utilisateur
					</button>
					<button
						class="version-tab"
						type="button"
						role="tab"
						aria-selected="false"
						data-version="professional"
						aria-label="Version Professionnel"
					>
						Professionnel
					</button>
				</div>

				<!-- Remet à zéro le téléphone actuellement affiché. -->
				<button
					class="phone-reset"
					type="button"
					data-phone-reset
					title="Réinitialiser le téléphone"
					aria-label="Réinitialiser le téléphone"
				>
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
				</button>

				<!-- Coché : l'écran d'accueil animé du téléphone est sauté. -->
				<input
					type="checkbox"
					class="switch skip-anim"
					id="skip-home-anim"
					role="switch"
					aria-label="Sans animation"
					title="Sans animation : ignorer l'écran d'accueil animé du téléphone"
				/>
				</div>

				<section class="phone" aria-label="Application Signaluo">
					<div class="phone-bar"></div>
					<div id="app" class="app"></div>
				</section>
			</div>
		</main>

		<div id="toast" class="toast" role="status"></div>
		<script src="vendor/maplibre/maplibre-gl.js"></script>
		<script>document.write('<script src="icons.js?v=' + Date.now() + '"><\/script>');</script>
		<script>document.write('<script src="app.js?v=' + Date.now() + '"><\/script>');</script>
		<script>document.write('<script src="guide.js?v=' + Date.now() + '"><\/script>');</script>
	</body>
</html>
